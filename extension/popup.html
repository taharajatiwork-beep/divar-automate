<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      min-height: 200px;
      font-family: Vazirmatn, system-ui, sans-serif;
      direction: rtl;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 13px;
    }
    .header {
      background: #1e293b;
      padding: 14px 16px;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h1 { font-size: 15px; font-weight: 700; }
    .header .badge {
      font-size: 10px;
      background: #166534;
      color: #86efac;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .section {
      padding: 14px 16px;
      border-bottom: 1px solid #1e293b;
    }
    .section:last-child { border-bottom: none; }
    .label { font-size: 11px; color: #64748b; margin-bottom: 6px; }
    .value { font-size: 14px; font-weight: 600; }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-left: 6px;
    }
    .status-active { background: #22c55e; }
    .status-inactive { background: #6b7280; }
    .task-info {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 8px;
    }
    .task-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      font-size: 12px;
    }
    .task-row .k { color: #94a3b8; }
    .task-row .v { color: #e2e8f0; font-weight: 500; }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-primary { background: #166534; color: white; }
    .btn-primary:hover { background: #15803d; }
    .btn-secondary { background: #334155; color: #94a3b8; }
    .btn-secondary:hover { background: #475569; }
    .btn-danger { background: #991b1b; color: #fca5a5; }
    .btn-danger:hover { background: #b91c1c; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      background: #991b1b30;
      color: #fca5a5;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 8px;
    }
    .empty {
      text-align: center;
      color: #64748b;
      padding: 20px;
      font-size: 12px;
    }
    .warning-banner {
      background: #78350f30;
      border: 1px solid #92400e;
      border-radius: 6px;
      padding: 8px 12px;
      margin-top: 8px;
      font-size: 11px;
      color: #fbbf24;
      text-align: center;
    }
    .edits-list {
      margin-top: 6px;
      font-size: 11px;
      color: #94a3b8;
    }
    .edit-item {
      background: #1e293b;
      padding: 4px 8px;
      border-radius: 4px;
      margin-top: 3px;
    }
    .edit-new { color: #86efac; }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">📢</span>
    <h1>دستیار آگهی دیوار</h1>
    <span class="badge">پایلوت</span>
  </div>

  <div id="content">
    <div class="empty">در حال بارگذاری...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
